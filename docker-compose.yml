services:
  # ==========================================
  # APLICAÇÃO (STREAMLIT)
  # ==========================================
  app:
    build: .
    container_name: tce_app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    ports:
      - "8501:8501"
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

  # ==========================================
  # EXTRATOR MANUAL / BACKFILL
  # ==========================================
  extrator:
    build: .
    container_name: tce_extrator
    environment:
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    command: python src/main.py 2024 2026
    restart: "no"

  # ==========================================
  # CLI / WIZARD
  # ==========================================
  cli:
    build: .
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
    command: python src/main.py

  # ==========================================
  # 🆕 ORQUESTRAÇÃO — AIRFLOW
  # ==========================================
  airflow-postgres:
    image: postgres:16
    container_name: tce_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_init
    user: root
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname Admin --role Admin
      --email admin@example.com || true"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Fortaleza
      AIRFLOW__CORE__DAGS_FOLDER: /app/src/orchestration/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      PYTHONPATH: /app:/app/src
      TZ: America/Fortaleza
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TRINO_URL: http://trino:8080/v1/statement
      TRINO_USER: airflow
    volumes: &airflow_volumes
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_webserver
    user: root
    command: airflow webserver --port 8080
    ports:
      - "8085:8080"
    environment: *airflow_env
    volumes: *airflow_volumes
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_scheduler
    user: root
    command: airflow scheduler
    environment: *airflow_env
    volumes: *airflow_volumes
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # CONSULTAS SQL NOS PARQUETS (POC)
  # ==========================================
  hive-metastore:
    image: apache/hive:4.0.1
    container_name: tce_hive_metastore
    command: >
      bash -lc "schematool -dbType derby -initSchema --ifNotExists &&
      hive --service metastore"
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_PORT: 9083
      TZ: America/Fortaleza
    volumes:
      - trino_metastore_data:/opt/hive/data/warehouse
      - ./data:/data:ro
      - ./trino_runtime:/trino-data
    ports:
      - "127.0.0.1:9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  trino:
    image: trinodb/trino:476
    container_name: tce_trino
    depends_on:
      hive-metastore:
        condition: service_healthy
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./data:/data:ro
      - ./trino_runtime:/trino-data:ro
    ports:
      - "127.0.0.1:8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  trino-bootstrap:
    image: python:3.12-slim
    container_name: tce_trino_bootstrap
    profiles: ["trino-bootstrap"]
    depends_on:
      trino:
        condition: service_healthy
    environment:
      TRINO_URL: http://trino:8080/v1/statement
      TRINO_USER: bootstrap
      DATA_DIR: /data
      TRINO_DATA_DIR: /trino-data
      TRINO_SOURCE_DIR: /data
    volumes:
      - ./data:/data:ro
      - ./trino_runtime:/trino-data
      - ./scripts/atualizar_catalogo_trino.py:/bootstrap.py:ro
    command: >
      bash -lc "pip install --no-cache-dir pyarrow==19.0.1 && python /bootstrap.py"
    restart: "no"

volumes:
  airflow_postgres_data:
  trino_metastore_data:
