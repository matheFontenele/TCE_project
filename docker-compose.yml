services:
  # ==========================================
  # APLICAÇÃO (STREAMLIT)
  # ==========================================
  app:
    build: .
    container_name: tce_app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    ports:
      - "8501:8501"
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

  # ==========================================
  # EXTRATOR MANUAL / BACKFILL
  # ==========================================
  extrator:
    build: .
    container_name: tce_extrator
    environment:
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    command: python src/main.py 2024 2026
    restart: "no"

  # ==========================================
  # CLI / WIZARD
  # ==========================================
  cli:
    build: .
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      - TZ=America/Fortaleza
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv
    command: python src/main.py

  # ==========================================
  # 🆕 ORQUESTRAÇÃO — AIRFLOW
  # ==========================================
  airflow-postgres:
    image: postgres:16
    container_name: tce_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_init
    user: root
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname Admin --role Admin
      --email admin@example.com || true"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Fortaleza
      AIRFLOW__CORE__DAGS_FOLDER: /app/src/orchestration/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      PYTHONPATH: /app:/app/src
      TZ: America/Fortaleza
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PARQUET_DB_HOST: parquet-db
      PARQUET_DB_PORT: "5432"
      PARQUET_DB_NAME: ${PARQUET_DB_NAME:-tce}
      PARQUET_DB_ADMIN_USER: ${PARQUET_DB_ADMIN_USER:-tce_admin}
      PARQUET_DB_ADMIN_PASSWORD: ${PARQUET_DB_ADMIN_PASSWORD:?defina PARQUET_DB_ADMIN_PASSWORD no .env}
    volumes: &airflow_volumes
      - .:/app
      - /app/__pycache__
      - /app/venv
      - /app/.git
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_webserver
    user: root
    command: airflow webserver --port 8080
    ports:
      - "8085:8080"
    environment: *airflow_env
    volumes: *airflow_volumes
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: src/orchestration/airflow/Dockerfile
    container_name: tce_airflow_scheduler
    user: root
    command: airflow scheduler
    environment: *airflow_env
    volumes: *airflow_volumes
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      parquet-db:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # CONSULTAS SQL NOS PARQUETS (Postgres + pg_duckdb)
  # ==========================================
  parquet-db:
    image: pgduckdb/pgduckdb:16-v1.1.1
    container_name: tce_parquet_db
    # O memory_limit padrão do DuckDB é 4 GB — quase toda a RAM de um host
    # pequeno. Com um limite menor, o DuckDB transborda para o disco em vez de
    # o kernel matar o Postgres (OOM) ao materializar as tabelas grandes.
    command:
      - postgres
      - -c
      - duckdb.memory_limit=${PARQUET_DB_MEMORY_LIMIT:-1536}
      - -c
      - duckdb.max_temp_directory_size=${PARQUET_DB_TEMP_LIMIT:-30GB}
    environment:
      POSTGRES_USER: ${PARQUET_DB_ADMIN_USER:-tce_admin}
      POSTGRES_PASSWORD: ${PARQUET_DB_ADMIN_PASSWORD:?defina PARQUET_DB_ADMIN_PASSWORD no .env}
      POSTGRES_DB: ${PARQUET_DB_NAME:-tce}
      TZ: America/Fortaleza
    volumes:
      - ./data:/data:ro
      - parquet_pgdata:/var/lib/postgresql/data
    ports:
      - "${PARQUET_DB_BIND_IP:-127.0.0.1}:${PARQUET_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARQUET_DB_ADMIN_USER:-tce_admin} -d ${PARQUET_DB_NAME:-tce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Build inicial das tabelas de consulta. Também serve para atualização manual:
  #   docker compose --profile parquet-init run --rm parquet-db-init
  parquet-db-init:
    image: python:3.12-slim
    container_name: tce_parquet_db_init
    profiles: ["parquet-init"]
    depends_on:
      parquet-db:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      PARQUET_DB_HOST: parquet-db
      PARQUET_DB_PORT: "5432"
      PARQUET_DB_NAME: ${PARQUET_DB_NAME:-tce}
      PARQUET_DB_ADMIN_USER: ${PARQUET_DB_ADMIN_USER:-tce_admin}
      PARQUET_DB_ADMIN_PASSWORD: ${PARQUET_DB_ADMIN_PASSWORD:?defina PARQUET_DB_ADMIN_PASSWORD no .env}
    volumes:
      - ./data:/data:ro
      - ./scripts/refresh_parquet_db.py:/refresh_parquet_db.py:ro
    command: >
      bash -lc "pip install --no-cache-dir pyarrow==19.0.1 psycopg2-binary==2.9.10
      && python /refresh_parquet_db.py"
    restart: "no"

volumes:
  airflow_postgres_data:
  parquet_pgdata:
